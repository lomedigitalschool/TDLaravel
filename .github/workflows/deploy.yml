name: Deploy Laravel to GHCR & Server with docker-compose

on:
  push:
    branches:
      - carnet-de-recettes-laravel-tailwind

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest .

      - name: Push to GHCR
        run: docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

      - name: Deploy to server with docker-compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "📁 Creating project directory..."
            mkdir -p $HOME/apps/carnet-de-recettes-laravel

            echo "📄 Copying nginx.conf from repo..."
            cp ./nginx.conf $HOME/apps/carnet-de-recettes-laravel/nginx.conf

            echo "⬇️ Pulling latest image from GHCR..."
            docker pull ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

            echo "🧹 Stopping old containers..."
            cd $HOME/apps/carnet-de-recettes-laravel
            docker compose down || true

            echo "📄 Injecting .env file..."
            cat << 'EOF' > $HOME/apps/carnet-de-recettes-laravel/.env
            ${{ secrets.LARAVEL_ENV }}
            EOF

            echo "📄 Writing docker-compose.yml..."
            cat << 'EOF' > $HOME/apps/carnet-de-recettes-laravel/docker-compose.yml
            version: '3.8'

            services:
              app:
                container_name: carnet-app
                image: ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest
                restart: unless-stopped
                env_file: .env
                working_dir: /var/www
                volumes:
                  - ./storage:/var/www/storage
                  - ./bootstrap/cache:/var/www/bootstrap/cache
                depends_on:
                  - db
                networks:
                  - carnet-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

              db:
                image: postgres:14
                container_name: carnet-db
                restart: unless-stopped
                environment:
                  POSTGRES_DB: recettes_db
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: samwin25
                volumes:
                  - carnet-db-data:/var/lib/postgresql/data
                networks:
                  - carnet-network

              web:
                image: nginx:stable-alpine
                container_name: carnet-nginx
                restart: unless-stopped
                ports:
                  - "9010:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - carnet-app-public:/var/www/public
                depends_on:
                  - app
                networks:
                  - carnet-network

            volumes:
              carnet-db-data:
              carnet-app-public:

            networks:
              carnet-network:
            EOF

            echo "🚀 Launching docker stack..."
            cd $HOME/apps/carnet-de-recettes-laravel
            docker compose up -d --build

            echo "✅ Waiting for app to be ready..."
            for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9010)
              if [ "$STATUS" -eq 200 ]; then
                echo "✅ Application is live and responding with HTTP 200"
                exit 0
              fi
              echo "⏳ Waiting... ($i/10)"
              sleep 5
            done

            echo "❌ Application did not respond with HTTP 200 after deployment"
            exit 1
