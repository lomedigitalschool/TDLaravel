name: Deploy Laravel to GHCR & Server with docker-compose

on:
  push:
    branches:
      - carnet-de-recettes-laravel-tailwind

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest .

      - name: Push to GHCR
        run: docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

      - name: Deploy to server with docker-compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "📁 Creating project directory..."
            mkdir -p $HOME/apps/carnet-de-recettes-laravel/nginx

            echo "⬇️ Pulling latest image from GHCR..."
            docker pull ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

            echo "🧹 Stopping old containers..."
            cd $HOME/apps/carnet-de-recettes-laravel
            docker compose down || true

            echo "📄 Injecting .env file..."
            cat << 'EOF' > $HOME/apps/carnet-de-recettes-laravel/.env
            ${{ secrets.LARAVEL_ENV }}
            EOF

            echo "📄 Writing docker-compose.yml..."
            cat << 'EOF' > $HOME/apps/carnet-de-recettes-laravel/docker-compose.yml
            version: '3.8'

            services:
              app:
                container_name: carnet-app
                image: ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest
                restart: unless-stopped
                env_file: .env
                working_dir: /var/www
                volumes:
                  - .:/var/www
                depends_on:
                  - db
                networks:
                  - carnet-network

              db:
                image: postgres:14
                container_name: carnet-db
                restart: unless-stopped
                environment:
                  POSTGRES_DB: recettes_db
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: samwin25
                volumes:
                  - carnet-db-data:/var/lib/postgresql/data
                networks:
                  - carnet-network

              web:
                image: nginx:stable-alpine
                container_name: carnet-nginx
                restart: unless-stopped
                ports:
                  - "9010:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
                  - .:/var/www
                depends_on:
                  - app
                networks:
                  - carnet-network

            volumes:
              carnet-db-data:

            networks:
              carnet-network:
            EOF

            echo "📄 Writing nginx/default.conf..."
            cat << 'EOF' > $HOME/apps/carnet-de-recettes-laravel/nginx/default.conf
            server {
                listen 80;
                index index.php index.html;
                server_name localhost;

                root /var/www/public;

                location / {
                    try_files \$uri \$uri/ /index.php?\$query_string;
                }

                location ~ \.php$ {
                    fastcgi_pass app:9000;
                    fastcgi_index index.php;
                    include fastcgi_params;
                    fastcgi_param SCRIPT_FILENAME /var/www/public\$fastcgi_script_name;
                }

                location ~ /\.ht {
                    deny all;
                }
            }
            EOF

            echo "🚀 Launching docker stack..."
            cd $HOME/apps/carnet-de-recettes-laravel
            docker compose up -d --build
