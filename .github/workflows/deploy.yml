name: Deploy Laravel to GHCR & Server

on:
  push:
    branches:
      - carnet-de-recettes-laravel-tailwind

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest .

      - name: Push to GHCR
        run: docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker pull ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest
            docker stop carnet-app || true
            docker rm carnet-app || true
            docker run -d \
              --name carnet-app \
              -p 9010:9000 \
              -v ${{ secrets.APP_DIRECTORY }}/.env:/var/www/.env \
              ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest
