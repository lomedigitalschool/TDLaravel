# ✅ pipeline corrigée avec fichier nginx.conf intégré corrigé

name: Deploy Laravel to GHCR & Server with docker-compose

on:
  push:
    branches:
      - carnet-de-recettes-laravel-tailwind

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest .

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "📁 Création du dossier de déploiement..."
            mkdir -p $HOME/apps/carnet-de-recettes-laravel/docker/nginx
            cd $HOME/apps/carnet-de-recettes-laravel

            echo "📄 Création du fichier nginx.conf corrigé..."
            cat << 'EOF' > docker/nginx/nginx.conf
            events {}

            http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;

              server {
                listen 80;
                server_name localhost;

                root /var/www/public;
                index index.php index.html;

                location / {
                  try_files $uri $uri/ /index.php?$query_string;
                }

                location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_pass carnet-app:9000;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
                  fastcgi_param DOCUMENT_ROOT /var/www/public;
                }

                location ~ /\.ht {
                  deny all;
                }
              }
            }
            EOF

            echo "🔧 Création du réseau Docker s'il n'existe pas..."
            docker network create carnet-network || true

            echo "⬇️ Pull de la dernière image GHCR..."
            docker pull ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

            echo "🧹 Arrêt des anciens conteneurs..."
            docker compose down || true

            echo "🚀 Lancement des nouveaux conteneurs..."
            docker compose up -d

            echo "🔧 Correction des permissions dans le conteneur Laravel..."
            docker exec carnet-app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            echo "🧪 Vérification que l'application est accessible..."
            for i in {1..10}; do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9010 || true)
              if [ "$STATUS" == "200" ]; then
                echo "✅ L'application est en ligne."
                exit 0
              fi
              echo "⏳ Tentative $i/10 en attente..."
            done

            echo "❌ L'application ne répond pas après 10 tentatives."
            exit 1
