name: Deploy Laravel to GHCR & Server with docker-compose

on:
  push:
    branches:
      - carnet-de-recettes-laravel-tailwind

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest .

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "📁 Création du dossier de déploiement..."
            mkdir -p $HOME/apps/carnet-de-recettes-laravel
            cd $HOME/apps/carnet-de-recettes-laravel

            echo "🔧 Création du réseau Docker s'il n'existe pas..."
            docker network create carnet-network || true

            echo "⬇️ Pull de la dernière image GHCR..."
            docker pull ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest

            echo "🧹 Arrêt des anciens conteneurs..."
            docker compose down || true

            echo "📄 Création du fichier .env..."
            cat << 'EOF' > .env
            ${{ secrets.LARAVEL_ENV }}
            EOF

            echo "📄 Création de docker-compose.yml..."
            cat << 'EOF' > docker-compose.yml
            

            services:
              app:
                container_name: carnet-app
                image: ghcr.io/${{ secrets.DOCKER_USERNAME }}/carnet-de-recettes-laravel:latest
                restart: unless-stopped
                env_file: .env
                working_dir: /var/www
                volumes:
                  - ./storage:/var/www/storage
                  - ./bootstrap/cache:/var/www/bootstrap/cache
                  - carnet-app-public:/var/www/public
                depends_on:
                  - db
                environment:
                  DB_CONNECTION: pgsql
                  DB_HOST: db
                  DB_PORT: 5432
                  DB_DATABASE: \${DB_DATABASE}
                  DB_USERNAME: \${DB_USERNAME}
                  DB_PASSWORD: \${DB_PASSWORD}
                networks:
                  - carnet-network

              web:
                image: nginx:stable-alpine
                container_name: carnet-nginx
                restart: always
                ports:
                  - "9010:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - carnet-app-public:/var/www/public
                depends_on:
                  - app
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:80"]
                  interval: 30s
                  timeout: 10s
                  retries: 5
                networks:
                  - carnet-network

              db:
                image: postgres:17
                container_name: carnet-postgres
                restart: always
                ports:
                  - "5435:5432"
                environment:
                  POSTGRES_DB: recettes_db
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: samwin25
                volumes:
                  - pgdata:/var/lib/postgresql/data
                networks:
                  - carnet-network
                healthcheck:
                  test: ["CMD", "pg_isready", "-U", "postgres"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              pgdata:
              carnet-app-public:

            networks:
              carnet-network:
                external: true
                name: carnet-network
            EOF

            echo "🚀 Lancement des conteneurs avec docker-compose..."
            docker compose up -d --build

            echo "🔧 Correction des permissions dans le conteneur Laravel..."
            docker exec carnet-app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            echo "🧪 Vérification que l'application est accessible..."
            for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9010)
              if [ "$STATUS" -eq 200 ]; then
                echo "✅ Application en ligne avec succès !"
                exit 0
              fi
              echo "⏳ Tentative $i/10 en attente..."
              sleep 5
            done

            echo "❌ L'application ne répond pas après 10 tentatives."
            exit 1
