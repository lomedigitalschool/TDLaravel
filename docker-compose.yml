

services:
  app:
    container_name: carnet-app
    image: ghcr.io/samwin25/carnet-de-recettes-laravel:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - carnet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:14
    container_name: carnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recettes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samwin25
    volumes:
      - carnet-db-data:/var/lib/postgresql/data
    networks:
      - carnet-network

  web:
    image: nginx:stable-alpine
    container_name: carnet-nginx
    restart: unless-stopped
    ports:
      - "9010:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - carnet-network

volumes:
  carnet-db-data:

networks:
  carnet-network:
