

services:
  app:
    build: .
    image: ghcr.io/samwin25/carnet-de-recettes-laravel-tailwind:latest
    container_name: laravel-app
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  web:
    image: nginx:stable-alpine
    container_name: nginx-web
    restart: unless-stopped
    ports:
      - "9008:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "15435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - app-network
    app:
       networks:
        - app-network:
           driver: bridge
    web:
       networks:
        - app-network


volumes:
  pgdata:
