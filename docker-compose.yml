services:
  app:
    container_name: carnet-app
    image: ghcr.io/samwin25/carnet-de-recettes-laravel:latest
    restart: unless-stopped
    env_file: .env
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    ports:
      - "9000" # ✅ Tu exposes bien ton application Laravel
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - laravel
    

  

  web:
    image: nginx:stable-alpine
    container_name: carnet-nginx
    restart: always
    ports:
      - "9010:80" # seul point d'accès exposé
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www

    depends_on:
      - app
    networks:
      - laravel


  db:
    image: postgres:17
    container_name: carnet-postgres
    restart: always
    ports:
      - "5433:5432"    # Utilise "always" pour redémarrer le conteneur en cas de plantage
    environment:
      POSTGRES_DB: recettes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samwin25
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel

volumes:
  pgdata:

networks:
  laravel:
